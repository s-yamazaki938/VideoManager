<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Manager</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #e0e5ec;
            --text-color: #44474b;
            --sub-text: #70757a;
            --nm-flat: 9px 9px 16px #bcbfc5, -9px -9px 16px #ffffff;
            --nm-inset: inset 6px 6px 12px #bcbfc5, inset -6px -6px 12px #ffffff;
            --accent-color: #4b7cf3;
            --danger-color: #ff7675;
        }

        [data-theme="dark"] {
            --bg-color: #2d3436;
            --text-color: #dfe6e9;
            --sub-text: #b2bec3;
            --nm-flat: 9px 9px 16px #1e2324, -9px -9px 16px #3c4548;
            --nm-inset: inset 6px 6px 12px #1e2324, inset -6px -6px 12px #3c4548;
            --accent-color: #74b9ff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'BIZ UDPGothic', sans-serif;
            margin: 0;
            display: flex;
            min-height: 100vh;
            transition: 0.3s;
        }

        .nm-card { background: var(--bg-color); border-radius: 20px; box-shadow: var(--nm-flat); padding: 20px; transition: 0.3s; }
        .nm-input { background: var(--bg-color); border: none; border-radius: 12px; box-shadow: var(--nm-inset); padding: 12px; outline: none; color: var(--text-color); width: 100%; box-sizing: border-box; }
        .nm-btn { background: var(--bg-color); border: none; border-radius: 12px; box-shadow: var(--nm-flat); padding: 10px 20px; cursor: pointer; transition: 0.2s; color: var(--text-color); font-weight: bold; white-space: nowrap; }
        .nm-btn:active { box-shadow: var(--nm-inset); }

        #sidebar { width: 240px; padding: 20px; display: none; }
        #main-content { flex: 1; padding: 20px; display: none; overflow-x: hidden; }
        .mobile-header { display: none; width: 100%; position: sticky; top: 0; z-index: 100; }
        .menu-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 998; }

        .screen { display: none; }
        .screen.active { display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 0.85em; }
        .td-url { word-break: break-all; color: var(--accent-color); text-decoration: none; font-size: 0.8em; }
        .td-title { font-weight: bold; }

        .header-pc { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-val { font-size: 2em; font-weight: bold; color: var(--accent-color); }
        hr { border: none; height: 1px; background: rgba(0,0,0,0.1); margin: 20px 0; }

        /* Mobile Layout */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar { position: fixed; left: -280px; top: 0; z-index: 1000; height: 100vh; width: 240px; display: block !important; transition: 0.3s; }
            #sidebar.open { left: 0; }
            .menu-overlay.active { display: block; }
            #main-content { padding: 15px; }
            .mobile-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: var(--bg-color); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
            .header-pc { display: none; }

            .stats-grid { grid-template-columns: 1fr; gap: 15px; }

            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            tr { margin-bottom: 25px; padding: 0; border-radius: 20px; box-shadow: var(--nm-flat); overflow: hidden; background: var(--bg-color); }
            
            td[data-label="Video Title"] {
                padding: 15px; text-align: left; background: rgba(0,0,0,0.03); border-bottom: 1px solid rgba(0,0,0,0.05); font-weight: bold; font-size: 1.1em;
            }

            td { padding: 10px 15px; text-align: right; border: none; font-size: 0.9em; display: flex; justify-content: space-between; align-items: center; }
            td::before { content: attr(data-label); font-weight: bold; color: var(--sub-text); font-size: 0.85em; margin-right: 10px; }
            
            td[data-label="Action"] { border-top: 1px solid rgba(0,0,0,0.05); justify-content: flex-end; gap: 10px; }
        }

        #login-screen { width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div class="mobile-header" id="mobile-nav" style="display:none;">
        <button class="nm-btn" id="btn-menu-open">☰</button>
        <h4 style="margin: 0;">Video Manager</h4>
        <button class="nm-btn" id="toggle-theme-mob" style="padding: 8px;">🌓</button>
    </div>
    <div id="menu-overlay" class="menu-overlay"></div>

    <div id="login-screen">
        <div class="nm-card" style="width: 320px;">
            <h2 style="text-align: center;">Login</h2>
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <input type="text" id="login-id" class="nm-input" placeholder="User ID">
                <input type="password" id="login-pw" class="nm-input" placeholder="Password">
                <button class="nm-btn" id="btn-login" style="color: var(--accent-color);">Login</button>
            </div>
        </div>
    </div>

    <aside id="sidebar">
        <div class="nm-card" style="height: calc(100vh - 40px);">
            <h3 style="text-align: center;">Menu</h3>
            <nav style="display: flex; flex-direction: column; gap: 15px;">
                <button class="nm-btn" onclick="showScreen('dashboard')">🏠 Dashboard</button>
                <button class="nm-btn" onclick="showScreen('video')">📹 Video List</button>
                <button class="nm-btn" onclick="showScreen('actor')">👤 Actor Master</button>
                <button class="nm-btn" onclick="showScreen('category')">📂 Category Master</button>
                <hr>
                <button class="nm-btn" id="toggle-theme">🌓 Theme Switch</button>
            </nav>
        </div>
    </aside>

    <main id="main-content">
        <header class="header-pc">
            <h2 id="screen-title">Dashboard</h2>
            <div>
                <span id="display-user"></span>
                <button class="nm-btn" id="btn-logout" style="color: var(--danger-color); margin-left:10px;">Logout</button>
            </div>
        </header>

        <section id="dashboard-screen" class="screen">
            <div class="stats-grid">
                <div class="nm-card"><div>Total Videos</div><div id="stat-video" class="stat-val">0</div></div>
                <div class="nm-card"><div>Total Actors</div><div id="stat-actor" class="stat-val">0</div></div>
                <div class="nm-card"><div>Total Categories</div><div id="stat-cat" class="stat-val">0</div></div>
            </div>
            <div class="nm-card">
                <h4>Recent Uploads</h4>
                <table id="table-recent">
                    <thead><tr><th>Video Title</th><th>URL</th><th>Created At</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <section id="video-screen" class="screen">
            <div class="nm-card" style="margin-bottom: 25px;">
                <h4 id="video-form-title">Registration</h4>
                <div style="display: grid; grid-template-columns: 1.5fr 1.5fr 1fr 1fr auto; gap: 10px; align-items: end;">
                    <input type="text" id="new-video-title" class="nm-input" placeholder="Video Title">
                    <input type="text" id="new-url" class="nm-input" placeholder="URL">
                    <select id="select-actor" class="nm-input"></select>
                    <select id="select-category" class="nm-input"></select>
                    <div style="display: flex; gap: 5px;">
                        <button class="nm-btn" id="btn-add-video">add</button>
                        <button class="nm-btn" id="btn-cancel-video" style="display:none;">cancel</button>
                    </div>
                </div>
                <hr>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="search-box" class="nm-input" placeholder="Search by Title or URL...">
                    <select id="filter-actor" class="nm-input" style="width: 150px;"><option value="">All Actors</option></select>
                </div>
            </div>
            <div class="nm-card">
                <table id="table-video">
                    <thead><tr><th>Video Title</th><th>URL</th><th>Actor</th><th>Category</th><th>Creator</th><th>Created</th><th>Updater</th><th>Updated</th><th>Action</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <section id="actor-screen" class="screen">
            <div class="nm-card" style="margin-bottom: 20px;">
                <h4 id="actor-form-title">Actor Registration</h4>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="new-actor-name" class="nm-input" placeholder="Actor Name">
                    <button class="nm-btn" id="btn-add-actor">add</button>
                    <button class="nm-btn" id="btn-cancel-actor" style="display:none;">cancel</button>
                </div>
            </div>
            <div class="nm-card"><table id="table-actor"><thead><tr><th>Name</th><th>Created</th><th>By</th><th>Action</th></tr></thead><tbody></tbody></table></div>
        </section>

        <section id="category-screen" class="screen">
            <div class="nm-card"><table id="table-category"><thead><tr><th>Category</th><th>Updated</th><th>By</th></tr></thead><tbody></tbody></table></div>
        </section>
    </main>

    <script>
        const SB_URL = 'https://tpemermrrxgdxppzewpn.supabase.co';
        const SB_KEY = 'sb_publishable_zr76EeMU58HUMoJJivdDoQ_Hflm3xX8';
        const db = supabase.createClient(SB_URL, SB_KEY);

        let currentUser = null, userCache = {}, actors = {}, cats = {}, allVideos = [];
        let editingVideoId = null, editingActorId = null;

        const fmtDate = (s) => s ? new Date(s).toLocaleString('ja-JP', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '-';

        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('menu-overlay');
        document.getElementById('btn-menu-open').onclick = () => { sidebar.classList.add('open'); overlay.classList.add('active'); };
        overlay.onclick = () => { sidebar.classList.remove('open'); overlay.classList.remove('active'); };

        const toggleTheme = () => {
            const theme = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', theme);
        };
        document.getElementById('toggle-theme').onclick = toggleTheme;
        document.getElementById('toggle-theme-mob').onclick = toggleTheme;

        async function initData() {
            const [u, a, c] = await Promise.all([db.from('m_user').select('id, user_id'), db.from('m_actor').select('*'), db.from('m_category').select('*')]);
            userCache = Object.fromEntries(u.data.map(i => [i.id, i.user_id]));
            actors = Object.fromEntries(a.data.map(i => [i.id, i.actor_name]));
            cats = Object.fromEntries(c.data.map(i => [i.id, i.category_name]));
            const aOpts = a.data.map(i => `<option value="${i.id}">${i.actor_name}</option>`).join('');
            document.getElementById('select-actor').innerHTML = aOpts;
            document.getElementById('filter-actor').innerHTML = '<option value="">All Actors</option>' + aOpts;
            document.getElementById('select-category').innerHTML = c.data.map(i => `<option value="${i.id}">${i.category_name}</option>`).join('');
        }

        window.showScreen = async (id) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id + '-screen').classList.add('active');
            const titles = {dashboard:'Dashboard', video:'Video List', actor:'Actor Master', category:'Category Master'};
            document.getElementById('screen-title').innerText = titles[id];
            sidebar.classList.remove('open'); overlay.classList.remove('active');
            await initData();
            if(id === 'dashboard') loadDashboard();
            if(id === 'video') loadVideos();
            if(id === 'actor') loadActors();
            if(id === 'category') loadCategories();
        };

        async function loadVideos() {
            const { data } = await db.from('url').select('*').order('created_at', {ascending: false});
            allVideos = data || [];
            filterVideos();
        }

        function filterVideos() {
            const word = document.getElementById('search-box').value.toLowerCase();
            const aid = document.getElementById('filter-actor').value;
            const filtered = allVideos.filter(v => 
                (v.url.toLowerCase().includes(word) || (v.video_title && v.video_title.toLowerCase().includes(word))) && 
                (!aid || v.actor_id == aid)
            );
            document.querySelector('#table-video tbody').innerHTML = filtered.map(v => `
                <tr>
                    <td data-label="Video Title" class="td-title">${v.video_title || '(No Title)'}</td>
                    <td data-label="URL"><a href="${v.url}" target="_blank" class="td-url">${v.url}</a></td>
                    <td data-label="Actor">${actors[v.actor_id] || '-'}</td>
                    <td data-label="Category">${cats[v.category_id] || '-'}</td>
                    <td data-label="Creator">${userCache[v.creator_id] || '-'}</td>
                    <td data-label="Created">${fmtDate(v.created_at)}</td>
                    <td data-label="Updater">${userCache[v.updater_id] || '-'}</td>
                    <td data-label="Updated">${fmtDate(v.updated_at)}</td>
                    <td data-label="Action">
                        <button class="nm-btn" style="padding:4px 8px;" onclick="editVideo(${v.id},'${v.url}',${v.actor_id},${v.category_id},'${v.video_title || ''}')">edit</button>
                        <button class="nm-btn" style="padding:4px 8px;color:var(--danger-color);" onclick="deleteVideo(${v.id})">delete</button>
                    </td>
                </tr>`).join('');
        }
        document.getElementById('search-box').oninput = filterVideos;
        document.getElementById('filter-actor').onchange = filterVideos;

        document.getElementById('btn-add-video').onclick = async () => {
            const url = document.getElementById('new-url').value;
            const title = document.getElementById('new-video-title').value;
            if(!url) return;
            if(!editingVideoId) { const { data } = await db.from('url').select('id').eq('url', url).maybeSingle(); if(data) return alert('Registered URL'); }
            const now = new Date().toISOString();
            const p = { url, video_title: title, actor_id: document.getElementById('select-actor').value, category_id: document.getElementById('select-category').value, updated_at: now, updater_id: currentUser.id };
            if(editingVideoId) await db.from('url').update(p).eq('id', editingVideoId);
            else await db.from('url').insert({...p, created_at: now, creator_id: currentUser.id});
            resetVideoForm(); loadVideos();
        };

        window.editVideo = (id, url, aid, cid, title) => { 
            editingVideoId = id; 
            document.getElementById('new-url').value = url; 
            document.getElementById('new-video-title').value = title;
            document.getElementById('select-actor').value = aid; 
            document.getElementById('select-category').value = cid; 
            document.getElementById('btn-add-video').innerText = "update"; 
            document.getElementById('btn-cancel-video').style.display = "inline-block"; 
        };
        window.deleteVideo = async (id) => { if(confirm('Delete?')) { await db.from('url').delete().eq('id', id); loadVideos(); } };
        function resetVideoForm() { editingVideoId = null; document.getElementById('new-url').value = ''; document.getElementById('new-video-title').value = ''; document.getElementById('btn-add-video').innerText = "add"; document.getElementById('btn-cancel-video').style.display = "none"; }
        document.getElementById('btn-cancel-video').onclick = resetVideoForm;

        async function loadActors() {
            const { data } = await db.from('m_actor').select('*').order('created_at', {ascending: false});
            document.querySelector('#table-actor tbody').innerHTML = data.map(a => `
                <tr>
                    <td data-label="Name">${a.actor_name}</td><td data-label="Date">${fmtDate(a.created_at)}</td><td data-label="By">${userCache[a.creator_id]}</td>
                    <td data-label="Action"><button class="nm-btn" onclick="editActor(${a.id},'${a.actor_name}')">edit</button> <button class="nm-btn" style="color:var(--danger-color);" onclick="deleteActor(${a.id})">delete</button></td>
                </tr>`).join('');
        }
        window.editActor = (id, name) => { editingActorId = id; document.getElementById('new-actor-name').value = name; document.getElementById('btn-add-actor').innerText = "update"; document.getElementById('btn-cancel-actor').style.display = "inline-block"; };
        document.getElementById('btn-add-actor').onclick = async () => {
            const name = document.getElementById('new-actor-name').value; if(!name) return;
            const now = new Date().toISOString();
            if(editingActorId) await db.from('m_actor').update({ actor_name: name, updated_at: now, updater_id: currentUser.id }).eq('id', editingActorId);
            else await db.from('m_actor').insert({ actor_name: name, created_at: now, updated_at: now, creator_id: currentUser.id, updater_id: currentUser.id });
            resetActorForm(); loadActors();
        };
        window.deleteActor = async (id) => { if(confirm('Delete?')) { const { error } = await db.from('m_actor').delete().eq('id', id); if(error) alert('Linked to video'); else loadActors(); } };
        function resetActorForm() { editingActorId = null; document.getElementById('new-actor-name').value = ''; document.getElementById('btn-add-actor').innerText = "add"; document.getElementById('btn-cancel-actor').style.display = "none"; }

        async function loadDashboard() {
            const { data } = await db.from('url').select('*').order('created_at', {ascending: false});
            document.getElementById('stat-video').innerText = data.length;
            document.getElementById('stat-actor').innerText = Object.keys(actors).length;
            document.getElementById('stat-cat').innerText = Object.keys(cats).length;
            document.getElementById('table-recent').querySelector('tbody').innerHTML = data.slice(0, 5).map(v => `<tr><td class="td-title">${v.video_title || '(No Title)'}</td><td class="td-url">${v.url}</td><td>${fmtDate(v.created_at)}</td></tr>`).join('');
        }

        async function loadCategories() {
            const { data } = await db.from('m_category').select('*');
            document.querySelector('#table-category tbody').innerHTML = data.map(c => `<tr><td data-label="名前">${c.category_name}</td><td data-label="更新日">${fmtDate(c.updated_at)}</td><td data-label="更新者">${userCache[c.updater_id]}</td></tr>`).join('');
        }

        document.getElementById('btn-login').onclick = async () => {
            const id = document.getElementById('login-id').value, pw = document.getElementById('login-pw').value;
            const { data } = await db.from('m_user').select('*').eq('user_id', id).eq('password', pw).maybeSingle();
            if(data) {
                currentUser = data;
                document.getElementById('login-screen').style.display='none';
                document.getElementById('sidebar').style.display='block';
                document.getElementById('main-content').style.display='block';
                document.getElementById('display-user').innerText = `User: ${data.user_id}`;
                if(window.innerWidth <= 768) document.getElementById('mobile-nav').style.display = 'flex';
                showScreen('dashboard');
            } else alert('Login Failed');
        };

        document.getElementById('btn-logout').onclick = () => location.reload();
    </script>
</body>
</html>
